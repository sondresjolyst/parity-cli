- package-ecosystem: npm
  directory: /
  groups:
    react:
      patterns:
        - react
        - react-dom
        - "@types/react"
        - "@types/react-dom"
    next:
      patterns:
        - next
        - eslint-config-next
    eslint:
      patterns:
        - eslint
        - eslint-config-*
    testing:
      patterns:
        - vitest
        - "@vitejs/*"
        - "@testing-library/*"
        - jsdom
    tailwind:
      patterns:
        - tailwindcss
        - "@tailwindcss/*"
        - postcss
    types:
      patterns:
        - "@types/*"
  schedule:
    interval: weekly
    day: sunday
    time: "03:00"
    timezone: Europe/Oslo
  cooldown:
    default-days: 7
  commit-message:
    prefix: deps(npm)
