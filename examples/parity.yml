owner: my-org
# discovery_mode: team
# teams:
#   - my-org/platform-team
templates_dir: templates
workflows_dir: workflows

language_threshold: 0.10
include_archived: false
include_forks: false

branch_name: parity/sync-standards

dependency_manager: dependabot
# dependency_manager_repos:      # per-repo override, either direction
#   my-repo: renovate
# renovate_preset: github>my-org/renovate-config
# renovate_remove_codeowners: false

workflows:
  dependency-review.yml:
    languages: [all]
    visibility: public   # dependency-review needs a public repo / GHAS
  dependabot-title.yml:
    languages: [all]
    manager: dependabot
  release-review.yml:
    languages: [all]
    manager: renovate

settings:
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  has_wiki: false
  allow_update_branch: true
  actions_default_workflow_permissions: read
  actions_can_approve_pull_request_reviews: true
  dependabot_alerts: true
  dependabot_security_updates: true

vars:
  owner: "@my-org/platform-team"
  # release_reviewers: someone,my-org/platform-team   # defaults to owner

# repo_vars:           # per-repo overrides of vars
#   my-repo:
#     release_reviewers: someone-else

# repos_include: []   # only these repos (empty = all)
# repos_exclude: []   # skip these repos

# language_map:       # override GitHub language -> template dir
#   TypeScript: node
