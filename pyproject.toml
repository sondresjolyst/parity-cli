[project]
name = "parity-cli"
version = "0.2.1"
description = "See and fix drift in dependabot.yml, CODEOWNERS and shared workflows across all your GitHub repos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sondre Sjølyst", email = "18713420+sondresjolyst@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
parity = "parity_cli.cli:app"

[build-system]
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
