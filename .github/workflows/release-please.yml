name: 🚀 Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@b6bbac3dc7bafb364ff42042a24ecad1046e16c2 # v9.39.3
    permissions:
      contents: write
      pull-requests: write
      issues: write
