name: 🚀 Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@436665154d16356aa4b690ebf43ae41db1b5f8da # v9.39.4
    permissions:
      contents: write
      pull-requests: write
      issues: write
