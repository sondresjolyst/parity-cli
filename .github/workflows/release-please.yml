name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@9f888bd4522bcfaf0cce912c78507079dcd0fc27 # v9.44.1
    permissions:
      contents: write
      pull-requests: write
      issues: write
