name: 🚀 Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@a98fb1dafcfb1acdeea610e70eb8c1a2be6b59cd # v9.39.2
    permissions:
      contents: write
      pull-requests: write
      issues: write
