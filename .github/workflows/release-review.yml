name: Request release review

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  request:
    name: Request review
    # parity fills in the reviewers. The unfilled source copy never runs.
    if: "!contains('${release_reviewers}', '$')"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request review on the open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEWERS: ${release_reviewers}
        run: |
          set -euo pipefail
          numbers=$(gh pr list --author app/github-actions --search "chore: release in:title" \
            --json number,reviews,reviewRequests \
            --jq '.[] | select((.reviews | length) == 0 and (.reviewRequests | length) == 0) | .number')
          echo "Release PRs needing a review request: ${numbers:-none}"
          for number in $numbers; do
            gh pr edit "$number" --add-reviewer "$REVIEWERS"
          done
